<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="crossweave" />
<title>crossweave</title>
<link rel="stylesheet" href="./vendor/xterm.css" />
<style>
  /* The cockpit's tokens (apps/cockpit/src/ui/tokens.ts, themes.ts), dark and light. */
  :root {
    --surface: #16191d; --surface-raised: #1e2126; --surface-hover: #2c313a; --surface-input: #1d1f23;
    --border: #37393d; --text: #abb2bf; --text-bright: #d7dae0; --text-dim: #9da5b4;
    --accent: #61afef; --on-accent: #16191d;
    --working: #4dc4ff; --ready: #a5e075; --needs-you: #f0a45d; --blocked: #ff7580;
    --radius: 8px;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --surface: #fafafa; --surface-raised: #f1f1f2; --surface-hover: #ececed; --surface-input: #ffffff;
      --border: #d6d6d9; --text: #383a42; --text-bright: #1f2126; --text-dim: #5b5e68;
      --accent: #0b5fc4; --on-accent: #fafafa;
      --working: #055a8f; --ready: #28600f; --needs-you: #8a4f00; --blocked: #bd2336;
      color-scheme: light;
    }
    /* The terminal stays dark in both: the session's own colours assume it. */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--surface); color: var(--text); -webkit-text-size-adjust: 100%; }
  #app { display: flex; flex-direction: column; min-height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface-raised); border-bottom: 1px solid var(--border); }
  .bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; color: var(--text-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--blocked); }
  .conn[data-on="true"] { background: var(--ready); }
  .icon { font-size: 26px; line-height: 1; padding: 0 8px 2px 0; background: none; border: 0; color: var(--accent); }
  .banner { margin: 0; padding: 8px 16px; font-size: 13px; background: var(--surface-hover); color: var(--text-bright); }
  .banner[data-kind="error"] { color: var(--needs-you); }
  main { flex: 1; display: flex; flex-direction: column; padding: 12px 16px 24px; gap: 16px; min-height: 0; }
  main.session { padding: 8px 0 0; gap: 8px; }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }
  .empty { margin: 4px 0; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-raised); }
  .card p { margin: 0 0 4px; }
  label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  input, select { font: inherit; font-size: 16px; /* 16px: iOS zooms into anything smaller */ padding: 10px 12px; color: var(--text-bright); background: var(--surface-input); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; cursor: pointer; }
  .primary { padding: 10px 16px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .primary:disabled { opacity: .6; }
  .ghost { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: none; color: var(--accent); font-size: 14px; }
  .error { margin: 0; color: var(--blocked); font-size: 14px; }
  a { color: var(--accent); }
  .project { display: flex; flex-direction: column; gap: 6px; }
  .project__head { display: flex; align-items: center; justify-content: space-between; }
  .project__head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; text-align: left; color: var(--text); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius); }
  .row:active { background: var(--surface-hover); }
  .row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row__title { color: var(--text-bright); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row__meta { font-size: 13px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text-dim); }
  .pill { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); }
  [data-tone="working"] .dot { background: var(--working); }
  [data-tone="asked"] .dot { background: var(--needs-you); }
  [data-tone="ready"] .dot { background: var(--ready); }
  [data-tone="failed"] .dot { background: var(--blocked); }
  [data-tone="asked"] .pill, .pill[data-tone="asked"] { color: var(--needs-you); border-color: var(--needs-you); }
  [data-tone="working"] .pill, .pill[data-tone="working"] { color: var(--working); }
  [data-tone="failed"] .pill, .pill[data-tone="failed"] { color: var(--blocked); }
  .session__head { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
  .session__head .row__title { flex: 1; min-width: 0; }
  /* The session's own grid, never resized from here: it scrolls sideways if it must. */
  .term { flex: 1; min-height: 40vh; overflow: auto; padding: 4px; background: #16191d; }
  .keys { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  .key { flex: none; min-width: 44px; height: 36px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-raised); color: var(--text-bright); }
  .key:active { background: var(--surface-hover); }
  .answer { display: flex; gap: 8px; padding: 0 16px 12px; }
  .stopped { margin: 0 16px; }
  .answer input { flex: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
