<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>crossweave — remote</title>
<link rel="stylesheet" href="./vendor/xterm.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #16191d; --panel: #1d2126; --line: #2e3339; --text: #c9d1d9; --muted: #8b949e;
    --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
    font: 13px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  /* The layout rules below set display on #login/#app, which would beat the UA's [hidden]. */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #login { display: grid; place-items: center; height: 100%; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; width: min(420px, 90vw); }
  #login h1 { font-size: 16px; margin: 0 0 4px; }
  #login p { color: var(--muted); margin: 0 0 16px; }
  #login .login-error { color: var(--err); }
  #login input { width: 100%; padding: 8px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font-family: ui-monospace, monospace; }
  #login button { margin-top: 12px; width: 100%; padding: 8px; background: var(--accent); color: #0d1117; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  #app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 44px 1fr 28px; height: 100%; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header strong { font-size: 13px; letter-spacing: .02em; }
  header #workspace { color: var(--muted); }
  aside { border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 6px 8px; }
  .session { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 7px 8px; margin-bottom: 2px; background: none; color: var(--text); border: 1px solid transparent; border-radius: 6px; cursor: pointer; font: inherit; text-align: left; }
  .session:hover { background: var(--panel); }
  .session[aria-current="true"] { background: var(--panel); border-color: var(--line); }
  .session__status { font-size: 11px; color: var(--muted); }
  .session__status[data-status="running"] { color: var(--ok); }
  .session__status[data-status="waiting"] { color: var(--warn); }
  .session__status[data-status="dead"] { color: var(--err); }
  .empty { color: var(--muted); padding: 6px; }
  main { padding: 8px; min-width: 0; min-height: 0; }
  #term { height: 100%; }
  footer { grid-column: 1 / -1; display: flex; align-items: center; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; }
  footer[data-kind="warn"], #status[data-kind="warn"] { color: var(--warn); }
  #status[data-kind="error"] { color: var(--err); }
  @media (max-width: 640px) { #app { grid-template-columns: 1fr; grid-template-rows: 44px auto 1fr 28px; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; } }
</style>
</head>
<body>
<section id="login" hidden>
  <form id="login-form">
    <h1>crossweave remote</h1>
    <p>Paste the token from <code>cw gateway token</code> (or <code>--read</code> for view-only).</p>
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <input id="login-token" type="password" autocomplete="off" spellcheck="false" placeholder="gateway token" required />
    <button type="submit">Connect</button>
  </form>
</section>
<div id="app" hidden>
  <header><strong>crossweave</strong><span id="workspace">connecting…</span></header>
  <aside><h2>Sessions</h2><div id="sessions"></div></aside>
  <main><div id="term"></div></main>
  <footer><span id="status">Connecting…</span></footer>
</div>
<script type="module">
import { Terminal } from './vendor/xterm.mjs';
import { FitAddon } from './vendor/addon-fit.mjs';
import { startWebApp } from './app.js';

startWebApp({
  doc: document,
  loc: location,
  makeTerminal: () => {
    const term = new Terminal({ cursorBlink: true, fontSize: 13, theme: { background: '#16191d' } });
    const fit = new FitAddon();
    term.loadAddon(fit);
    return {
      open: (el) => term.open(el),
      write: (d) => term.write(d),
      reset: () => term.reset(),
      onData: (cb) => term.onData(cb),
      fit: () => fit.fit(),
      get cols() { return term.cols; },
      get rows() { return term.rows; },
    };
  },
}).catch((err) => {
  const el = document.getElementById('status');
  if (el) { el.textContent = String(err && err.message ? err.message : err); el.dataset.kind = 'error'; }
});
</script>
</body>
</html>
