<!doctype html>
<html>
<head><meta charset="utf-8"><title>crossweave — remote</title>
<style>body{font-family:monospace;background:#16191d;color:#abb2bf;margin:0;padding:12px} #term{border:1px solid #37393d;height:70vh}</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.css" />
</head>
<body>
<h1>crossweave remote</h1>
<div id="tabs" style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap"></div>
<div id="sessions">Loading sessions…</div>
<div style="display:flex;gap:12px"><div id="explorer" style="width:240px;border:1px solid #37393d;padding:8px;overflow:auto;max-height:70vh"></div><div id="term" style="flex:1"></div></div>
<div id="fileview" style="border:1px solid #37393d;margin-top:8px;padding:8px;display:none"><pre id="filecontent" style="white-space:pre-wrap"></pre></div>
<script type="module">
import { Terminal } from 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5/+esm';
import { wsTransport } from './ws-transport.js';
import { createWebClient } from './client.js';
const token = new URLSearchParams(location.search).get('token') || '';
// Token via query is visible in logs — prefer header when the gateway supports it; query kept for compat
const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws${token ? `?token=${encodeURIComponent(token)}` : ''}`;
const transport = await wsTransport(wsUrl);
const term = new Terminal({ cursorBlink: true });
term.open(document.getElementById('term'));
const wc = await createWebClient({ transport, onData: (c) => term.write(c), onNotification: (m,p) => { if(m==='tui.event') console.log('notify',p); }});
const sessions = await wc.client.call('session.list', token ? { token } : {});
document.getElementById('sessions').textContent = JSON.stringify(sessions, null, 2);
if (sessions[0]?.id) await wc.attach(sessions[0].id);
// File explorer: list via workspace.openFile (demo: show hello.txt if exists)
try { const ls=await wc.listFiles(''); const ex=document.getElementById('explorer'); ex.innerHTML=''; (ls.files||[]).forEach(f=>{ const d=document.createElement('div'); d.textContent=(f.isDirectory?'📁 ':'📄 ')+f.name; d.style.cursor='pointer'; d.onclick=async()=>{ if(!f.isDirectory){ try{ const r=await wc.openFile(f.name); document.getElementById('filecontent').textContent=r.content; document.getElementById('fileview').style.display='block'; }catch(e){} } }; ex.appendChild(d); }); } catch(e){}
// Browser tabs strip (in-memory, localStorage pins)
const tabs=[]; function renderTabs(){ const el=document.getElementById('tabs'); el.innerHTML=''; tabs.forEach((tb,i)=>{ const b=document.createElement('button'); b.textContent=`${tb.pinned?'📌':''}${tb.title||tb.url} ×`; b.style.cssText='padding:4px 8px;background:#23272e;color:#abb2bf;border:1px solid #37393d;border-radius:4px;cursor:pointer'; b.onclick=()=>{ tabs.splice(i,1); renderTabs(); }; b.oncontextmenu=(e)=>{ e.preventDefault(); tb.pinned=!tb.pinned; localStorage.setItem('cw_tabs_pins',JSON.stringify(tabs.filter(x=>x.pinned).map(x=>x.url))); renderTabs(); }; el.appendChild(b); }); }
window.openBrowserTab=(url,title)=>{ tabs.push({id:Date.now(),url,title:title||url,pinned:false}); renderTabs(); };

term.onData((d) => { const sid = sessions[0]?.id; if(sid) wc.sendInput(d, sid); });
</script>
</body>
</html>
