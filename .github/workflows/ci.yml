name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Collision Radar's reference check shells out to `rg`; not preinstalled
      # on ubuntu-latest, unlike the macOS dev environment (Homebrew).
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
