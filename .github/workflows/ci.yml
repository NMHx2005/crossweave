name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Collision Radar's reference check shells out to `rg`; not preinstalled
      # on ubuntu-latest, unlike the macOS dev environment (Homebrew).
      - run: sudo apt-get update && apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  sandbox-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update && apt-get install -y bubblewrap ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/isolation/sandbox.test.ts

  cockpit:
    # The app is macOS-only ("os": ["darwin"] in its package.json), so it is built
    # where it can actually run. Root `bun test` already executes apps/cockpit's
    # tests, but root `tsc --noEmit` does NOT cover the app (tsconfig includes
    # src/ and tests/ only) — before this job, a cockpit type or bundle break was
    # invisible until someone ran `dist:mac` by hand.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: install cockpit dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/cockpit
      - name: typecheck and bundle
        run: bun run build
        working-directory: apps/cockpit
