name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      matrix:
        # @opentui/core (M8) ships per-platform optional native packages;
        # `bun install` only installs the ones matching the CURRENT host, so
        # cross-compiling a darwin target from ubuntu-latest can't resolve
        # them. Build each target on a runner that's actually that platform.
        include:
          - target: darwin-arm64
            os: macos-14
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Bun 1.3.12 truncates the LC_CODE_SIGNATURE segment of `bun build
      # --compile` output on macOS (oven-sh/bun#29120), producing an unsigned
      # binary that the kernel SIGKILLs on launch. Fixed in 1.3.13.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build.ts --target=${{ matrix.target }}
      - run: |
          mv dist/cw-${{ matrix.target }} cw-${{ matrix.target }}
          mv dist/cwd-${{ matrix.target }} cwd-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: |
            cw-${{ matrix.target }}
            cwd-${{ matrix.target }}


  cockpit:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: install cockpit dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/cockpit
      # Bun deliberately does not run dependency postinstall scripts. Electron's
      # package therefore exists but its runtime binary does not until this explicit,
      # reviewable install step runs.
      - name: install Electron runtime
        run: bun node_modules/electron/install.js
        working-directory: apps/cockpit
      - name: package Cockpit
        run: bun run dist:mac
        working-directory: apps/cockpit
      - name: normalize Cockpit asset names
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          mv "release/crossweave Cockpit-${VERSION}-arm64.zip" release/cockpit-darwin-arm64.zip
          mv "release/crossweave Cockpit-${VERSION}-arm64.dmg" release/cockpit-darwin-arm64.dmg
        working-directory: apps/cockpit
      - uses: actions/upload-artifact@v7
        with:
          name: build-cockpit-darwin-arm64
          path: |
            apps/cockpit/release/cockpit-darwin-arm64.zip
            apps/cockpit/release/cockpit-darwin-arm64.dmg

  release:
    needs: [build, cockpit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
      - name: checksums
        run: |
          sha256sum cw-* cwd-* cockpit-* install.sh > checksums.txt
      # Curated notes live in docs/releases/<tag>.md. Every release before this one
      # shipped with an EMPTY body (v0.1.0-v0.2.1: 1 char each), because the action
      # only generates notes when asked to — so an absent file falls back to GitHub's
      # generated notes rather than to nothing.
      - name: resolve release notes
        id: notes
        run: |
          path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "Using curated notes: $path"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No $path — falling back to generated notes"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            cw-*
            cwd-*
            cockpit-*
            install.sh
            checksums.txt
