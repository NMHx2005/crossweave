name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build.ts --target=${{ matrix.target }}
      - run: |
          mv dist/cw-${{ matrix.target }} cw-${{ matrix.target }}
          mv dist/cwd-${{ matrix.target }} cwd-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: |
            cw-${{ matrix.target }}
            cwd-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
      - name: checksums
        run: |
          cp install.sh .
          sha256sum cw-* cwd-* install.sh > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cw-*
            cwd-*
            install.sh
            checksums.txt
